name = "mathlibAnnex"
version = "0.6.0"
defaultTargets = ["MathlibAnnex"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "MathlibAnnex"

# Include each Project facade in the root library build.
roots = ["MathlibAnnex", "MathlibAnnex.Projects.Mankiewicz", "MathlibAnnex.Projects.SphereRigidity", "MathlibAnnex.Projects.Naimark", "MathlibAnnex.Projects.PureStateHomogeneity", "MathlibAnnex.Projects.Rosenberg", "MathlibAnnex.Projects.GeometricStructureSpaces", "MathlibAnnex.Projects.LipschitzHomeomorphicBanachSpaces"]

# FIX2 library and explicit source-bound validation targets.
[[lean_lib]]
name = "BanachGeometry"

[[lean_lib]]
name = "Projects"

[[lean_lib]]
name = "Audit"

[[lean_lib]]
name = "Tests"
