{
  "concurrency": {
    "cancel-in-progress": false,
    "group": "gss-${{ github.sha }}"
  },
  "jobs": {
    "base": {
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "env": {
        "EXPECTED_COMMIT": "${{ inputs.expected_commit }}",
        "EXPECTED_MATHLIB": "${{ inputs.expected_mathlib }}",
        "EXPECTED_TOOLCHAIN": "${{ inputs.expected_toolchain }}",
        "EXPECTED_TREE": "${{ inputs.expected_tree }}",
        "LAKE_ARTIFACT_CACHE": "false",
        "LAKE_NO_CACHE": "true",
        "QUALIFICATION_MODE": "BOOTSTRAP_SCOPED_LINUX",
        "REPOSITORY_PRIVATE": "${{ github.event.repository.private }}",
        "STAGE_NAME": "base",
        "WORKFLOW_SHA": "${{ github.workflow_sha }}"
      },
      "if": "${{ github.event_name == 'workflow_dispatch' && github.event.repository.private == true && github.repository_id == '1367564442' }}",
      "name": "base dependency-scoped native qualification",
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "id": "prepare_paths",
          "name": "Define runner-local paths before identity checks",
          "run": "set -euo pipefail\n: \"${RUNNER_TEMP:?RUNNER_TEMP must be provided by GitHub}\"\n: \"${GITHUB_ENV:?GITHUB_ENV must be provided by GitHub}\"\nprintf '%s\\n' \"INCOMING_DIR=$RUNNER_TEMP/gss-incoming\" \"PAYLOAD_DIR=$RUNNER_TEMP/gss-payload\" \"QUALIFICATION_DIR=$RUNNER_TEMP/gss-evidence\" >> \"$GITHUB_ENV\"\nprintf '%s\\n' \"MATHLIB_CACHE_DIR=$RUNNER_TEMP/gss-mathlib-compressed\" >> \"$GITHUB_ENV\"\n",
          "shell": "bash"
        },
        {
          "id": "checkout",
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "fetch-depth": 1,
            "persist-credentials": false,
            "ref": "${{ github.sha }}"
          }
        },
        {
          "id": "identity",
          "name": "Bind exact candidate before setup",
          "run": "python3 -B scripts/segmented_qualification.py identity"
        },
        {
          "id": "before_setup",
          "run": "python3 -B scripts/segmented_qualification.py capacity before_setup\npython3 -B scripts/segmented_qualification.py setup-admission"
        },
        {
          "id": "lean_setup",
          "uses": "leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596",
          "with": {
            "auto-config": false,
            "axiom-audit": false,
            "build": false,
            "check-reservoir-eligibility": false,
            "lean4checker": false,
            "leanchecker": false,
            "lint": false,
            "mk_all-check": false,
            "nanoda": false,
            "test": false,
            "use-github-cache": false,
            "use-mathlib-cache": false
          }
        },
        {
          "env": {
            "SETUP_OUTCOME": "${{ steps.lean_setup.outcome }}"
          },
          "id": "after_toolchain",
          "if": "${{ always() && steps.identity.outcome == 'success' }}",
          "run": "python3 -B scripts/segmented_qualification.py capacity after_toolchain_setup"
        },
        {
          "id": "cache_get",
          "run": "python3 -B scripts/segmented_qualification.py cache-get"
        },
        {
          "env": {
            "CACHE_OUTCOME": "${{ steps.cache_get.outcome }}"
          },
          "id": "after_cache",
          "if": "${{ always() && steps.identity.outcome == 'success' }}",
          "run": "python3 -B scripts/segmented_qualification.py capacity after_cache_expansion"
        },
        {
          "id": "cleanup_compressed",
          "run": "python3 -B scripts/segmented_qualification.py cleanup-compressed"
        },
        {
          "id": "native_admission",
          "run": "python3 -B scripts/segmented_qualification.py native-admission"
        },
        {
          "continue-on-error": true,
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "id": "compile",
          "name": "Sequential native Lean: base",
          "run": "python3 -B scripts/segmented_qualification.py stage base",
          "timeout-minutes": 300
        },
        {
          "env": {
            "CACHE_OUTCOME": "${{ steps.cache_get.outcome }}",
            "COMPILE_OUTCOME": "${{ steps.compile.outcome }}",
            "DOWNLOAD_OUTCOME": "",
            "FINAL_CHECKS_OUTCOME": "",
            "IDENTITY_OUTCOME": "${{ steps.identity.outcome }}",
            "RESOURCE_OUTCOME": "${{ steps.native_admission.outcome }}",
            "SETUP_OUTCOME": "${{ steps.lean_setup.outcome }}"
          },
          "id": "collect",
          "if": "${{ always() }}",
          "run": "python3 -B scripts/segmented_qualification.py collect"
        },
        {
          "id": "upload_guard",
          "if": "${{ always() && steps.collect.outcome == 'success' }}",
          "name": "Measure actual payload and cumulative storage bound",
          "run": "python3 -B scripts/segmented_qualification.py upload-guard"
        },
        {
          "id": "upload_evidence",
          "if": "${{ always() && steps.upload_guard.outcome == 'success' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "compression-level": 6,
            "if-no-files-found": "error",
            "include-hidden-files": true,
            "name": "gss-base-evidence-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/gss-job-evidence",
            "retention-days": 3
          }
        },
        {
          "id": "upload_b0",
          "if": "${{ always() && steps.upload_guard.outcome == 'success' && contains(fromJSON(steps.upload_guard.outputs.bundles || '[]'), 'base-b00') }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "compression-level": 6,
            "if-no-files-found": "error",
            "include-hidden-files": true,
            "name": "gss-base-b00-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/gss-bundles/base-b00",
            "retention-days": 3
          }
        },
        {
          "id": "upload_b1",
          "if": "${{ always() && steps.upload_guard.outcome == 'success' && contains(fromJSON(steps.upload_guard.outputs.bundles || '[]'), 'base-b01') }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "compression-level": 6,
            "if-no-files-found": "error",
            "include-hidden-files": true,
            "name": "gss-base-b01-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/gss-bundles/base-b01",
            "retention-days": 3
          }
        },
        {
          "id": "upload",
          "if": "${{ always() && steps.upload_guard.outcome == 'success' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "compression-level": 6,
            "if-no-files-found": "error",
            "include-hidden-files": true,
            "name": "gss-base-receipt-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/gss-payload",
            "retention-days": 3
          }
        },
        {
          "env": {
            "UPLOAD_OUTCOME": "${{ steps.upload_evidence.outcome == 'success' && steps.upload_b0.outcome == 'success' && steps.upload_b1.outcome == 'success' && steps.upload.outcome == 'success' && 'success' || 'failure' }}"
          },
          "id": "require",
          "if": "${{ always() }}",
          "run": "python3 -B scripts/segmented_qualification.py require-stage"
        },
        {
          "id": "diagnostic",
          "if": "${{ always() && steps.identity.outcome == 'success' }}",
          "name": "Bounded diagnostics independent of build reserve",
          "run": "python3 -B scripts/segmented_qualification.py diagnostic"
        },
        {
          "id": "diagnostic_upload",
          "if": "${{ always() && steps.diagnostic.outcome == 'success' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "compression-level": 6,
            "if-no-files-found": "error",
            "name": "gss-base-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/gss-diagnostic",
            "retention-days": 3
          }
        }
      ],
      "timeout-minutes": 330
    },
    "failure_report": {
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "env": {
        "EXPECTED_COMMIT": "${{ inputs.expected_commit }}",
        "EXPECTED_MATHLIB": "${{ inputs.expected_mathlib }}",
        "EXPECTED_TOOLCHAIN": "${{ inputs.expected_toolchain }}",
        "EXPECTED_TREE": "${{ inputs.expected_tree }}",
        "LAKE_ARTIFACT_CACHE": "false",
        "LAKE_NO_CACHE": "true",
        "NEEDS_JSON": "${{ toJSON(needs) }}",
        "QUALIFICATION_MODE": "BOOTSTRAP_SCOPED_LINUX",
        "REPOSITORY_PRIVATE": "${{ github.event.repository.private }}",
        "STAGE_NAME": "failure-report",
        "WORKFLOW_SHA": "${{ github.workflow_sha }}"
      },
      "if": "${{ always() && github.event_name == 'workflow_dispatch' && github.event.repository.private == true && github.repository_id == '1367564442' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled')) }}",
      "name": "Bounded failure report (no Lean setup)",
      "needs": [
        "base",
        "gss_01",
        "gss_02",
        "gss_03",
        "gss_04",
        "gss_05",
        "gss_06",
        "gss_07",
        "other",
        "final"
      ],
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "id": "prepare_paths",
          "name": "Define runner-local paths before identity checks",
          "run": "set -euo pipefail\n: \"${RUNNER_TEMP:?RUNNER_TEMP must be provided by GitHub}\"\n: \"${GITHUB_ENV:?GITHUB_ENV must be provided by GitHub}\"\nprintf '%s\\n' \"INCOMING_DIR=$RUNNER_TEMP/gss-incoming\" \"PAYLOAD_DIR=$RUNNER_TEMP/gss-payload\" \"QUALIFICATION_DIR=$RUNNER_TEMP/gss-evidence\" >> \"$GITHUB_ENV\"\nprintf '%s\\n' \"MATHLIB_CACHE_DIR=$RUNNER_TEMP/gss-mathlib-compressed\" >> \"$GITHUB_ENV\"\n",
          "shell": "bash"
        },
        {
          "id": "checkout",
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "fetch-depth": 1,
            "persist-credentials": false,
            "ref": "${{ github.sha }}"
          }
        },
        {
          "id": "report",
          "name": "Bounded failure report without Lean or prior artifacts",
          "run": "python3 -B scripts/segmented_qualification.py failure-report"
        },
        {
          "id": "upload",
          "if": "${{ always() && steps.report.outcome == 'success' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "compression-level": 6,
            "if-no-files-found": "error",
            "include-hidden-files": true,
            "name": "gss-failure-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/gss-payload",
            "retention-days": 3
          }
        },
        {
          "id": "fail",
          "if": "${{ always() }}",
          "run": "echo \"Required qualification job failed; failure reporting never converts this to PASS.\"\nexit 1"
        }
      ],
      "timeout-minutes": 5
    },
