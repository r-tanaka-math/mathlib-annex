          "if": "${{ always() && steps.upload_guard.outcome == 'success' && contains(fromJSON(steps.upload_guard.outputs.bundles || '[]'), 'other-b00') }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "compression-level": 6,
            "if-no-files-found": "error",
            "include-hidden-files": true,
            "name": "gss-other-b00-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/gss-bundles/other-b00",
            "retention-days": 3
          }
        },
        {
          "id": "upload",
          "if": "${{ always() && steps.upload_guard.outcome == 'success' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "compression-level": 6,
            "if-no-files-found": "error",
            "include-hidden-files": true,
            "name": "gss-other-receipt-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/gss-payload",
            "retention-days": 3
          }
        },
        {
          "env": {
            "UPLOAD_OUTCOME": "${{ steps.upload_evidence.outcome == 'success' && steps.upload_b0.outcome == 'success' && steps.upload.outcome == 'success' && 'success' || 'failure' }}"
          },
          "id": "require",
          "if": "${{ always() }}",
          "run": "python3 -B scripts/segmented_qualification.py require-stage"
        },
        {
          "id": "diagnostic",
          "if": "${{ always() && steps.identity.outcome == 'success' }}",
          "name": "Bounded diagnostics independent of build reserve",
          "run": "python3 -B scripts/segmented_qualification.py diagnostic"
        },
        {
          "id": "diagnostic_upload",
          "if": "${{ always() && steps.diagnostic.outcome == 'success' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "compression-level": 6,
            "if-no-files-found": "error",
            "name": "gss-other-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/gss-diagnostic",
            "retention-days": 3
          }
        }
      ],
      "timeout-minutes": 330
    }
  },
  "name": "Frozen GSS segmented qualification",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "expected_commit": {
          "description": "Exact frozen private release commit (40 hex)",
          "required": true,
          "type": "string"
        },
        "expected_mathlib": {
          "default": "360da6fa66c1273b76b6b2d8c5666fd5ac2e3b56",
          "description": "Exact Mathlib commit",
          "required": true,
          "type": "string"
        },
        "expected_toolchain": {
          "default": "leanprover/lean4:v4.32.0-rc1",
          "description": "Exact Lean release toolchain",
          "required": true,
          "type": "string"
        },
        "expected_tree": {
          "description": "Exact frozen private release tree (40 hex)",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "actions": "read",
    "contents": "read"
  }
}
