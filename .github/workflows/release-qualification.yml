{"jobs":{"qualify":{"defaults":{"run":{"shell":"bash"}},"env":{"LAKE_ARTIFACT_CACHE":"false","LAKE_NO_CACHE":"true","QUALIFICATION_MODE":"HOSTED_CLEAN_ANNEX"},"if":"${{ github.event_name == 'workflow_dispatch' && github.event.repository.private == true }}","name":"Build, import, compiled-axiom audit and evidence","runs-on":"ubuntu-24.04","steps":[{"id":"prepare","name":"Prepare durable runner evidence","run":"set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/release-qualification\"\necho \"QUALIFICATION_DIR=$RUNNER_TEMP/release-qualification\" >> \"$GITHUB_ENV\"\ncat > \"$RUNNER_TEMP/release-qualification-bash-env\" <<'BASH'\nexec > >(tee -a \"$QUALIFICATION_DIR/raw-shell.log\") 2>&1\nBASH\necho \"BASH_ENV=$RUNNER_TEMP/release-qualification-bash-env\" >> \"$GITHUB_ENV\"\n","shell":"bash"},{"id":"checkout","name":"Checkout exact selected private candidate","uses":"actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5","with":{"fetch-depth":1,"persist-credentials":false,"ref":"${{ github.sha }}"}},{"env":{"EXPECTED_COMMIT":"${{ inputs.expected_commit }}","EXPECTED_MATHLIB":"${{ inputs.expected_mathlib }}","EXPECTED_TOOLCHAIN":"${{ inputs.expected_toolchain }}","EXPECTED_TREE":"${{ inputs.expected_tree }}","WORKFLOW_SHA":"${{ github.workflow_sha }}"},"id":"identity","name":"Bind exact source and workflow identities","run":"python3 scripts/release_qualification.py identity"},{"continue-on-error":true,"id":"lean","if":"${{ steps.identity.outcome == 'success' }}","name":"Build MathlibAnnex and audit compiled axioms","timeout-minutes":300,"uses":"leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596","with":{"auto-config":false,"axiom-audit":true,"axiom-audit-allow":"propext,Classical.choice,Quot.sound","axiom-audit-root":"MathlibAnnex","build":true,"build-args":"MathlibAnnex","check-reservoir-eligibility":false,"lean4checker":false,"leanchecker":false,"lint":false,"mk_all-check":false,"nanoda":false,"test":false,"use-github-cache":false,"use-mathlib-cache":true}},{