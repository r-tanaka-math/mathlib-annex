if":"${{ always() && steps.checkout.outcome == 'success' }}","name":"Check tracked, staged and porcelain cleanliness","run":"python3 scripts/release_qualification.py clean"},{"env":{"AXIOM_STATUS":"${{ steps.lean.outputs.axiom-audit-status }}","BUILD_STATUS":"${{ steps.lean.outputs.build-status }}","CLEAN_OUTCOME":"${{ steps.clean.outcome }}","IDENTITY_OUTCOME":"${{ steps.identity.outcome }}","IMPORT_OUTCOME":"${{ steps.downstream.outcome }}","NAIMARK_PROJECT_IMPORT_OUTCOME":"${{ steps.naimark_project_entry.outcome }}","PROJECT_ENTRY_PARSER_OUTCOME":"${{ steps.project_entry_parser.outcome }}","PROJECT_IMPORT_OUTCOME":"${{ steps.project_entry.outcome }}","PURE_STATE_HOMOGENEITY_PROJECT_IMPORT_OUTCOME":"${{ steps.pure_state_homogeneity_project_entry.outcome }}","ROSENBERG_PROJECT_IMPORT_OUTCOME":"${{ steps.rosenberg_project_entry.outcome }}","SPHERE_PROJECT_IMPORT_OUTCOME":"${{ steps.sphere_project_entry.outcome }}"},"id":"summary","if":"${{ always() }}","name":"Write owner summary and machine receipt","run":"if test -f scripts/release_qualification.py; then\n  python3 scripts/release_qualification.py summary\nelse\n  python3 - <<'PY'\nimport json,os,pathlib\np=pathlib.Path(os.environ['QUALIFICATION_DIR'])\nv={'schema':'mathlibannex.checkout-failure-receipt.v1','qualification':'FAIL','reason':'Checkout or runner helper unavailable','public_deployment':'NOT PERFORMED'}\n(p/'qualification.json').write_text(json.dumps(v,sort_keys=True)+'\\n')\nwith open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('# Qualification failed\\n\\nCheckout/helper unavailable. Public deployment: NOT PERFORMED.\\n')\nPY\nfi\n"},{"id":"upload","if":"${{ always() }}","name":"Upload qualification receipt and raw logs","uses":"actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02","with":{"if-no-files-found":"error","name":"release-qualification-${{ github.sha }}-${{ github.run_attempt }}","path":"${{ runner.temp }}/release-qualification/","retention-days":30}},{"id":"require","if":"${{ always() }}","name":"Require every independent check to pass","run":"python3 scripts/release_qualification.py require"}],"timeout-minutes":330}},"name":"Manual release qualification","on":{"workflow_dispatch":{"inputs":{"expected_commit":{"description":"Exact frozen private release commit (40 hex)","required":true,"type":"string"},"expected_mathlib":{"default":"360da6fa66c1273b76b6b2d8c5666fd5ac2e3b56","description":"Exact Mathlib commit","required":true,"type":"string"},"expected_toolchain":{"default":"leanprover/lean4:v4.32.0-rc1","description":"Exact Lean release toolchain","required":true,"type":"string"},"expected_tree":{"description":"Exact frozen private release tree (40 hex)","required":true,"type":"string"}}}},"permissions":{"contents":"read"}}
